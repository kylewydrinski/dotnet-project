
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotStudy</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/pages/explore.html">Explore</a>
        <a href="/pages/mystudies.html">My Studies</a>
        <a href="/pages/about.html">About</a>
        <a href="/pages/login.html">Log In</a>
        <a href="/pages/signup.html">Sign Up</a>
    </nav>

    <main>
        <h1>Sign Up</h1>
        <form id="signupForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                autocomplete="username"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="256"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account</button>

            <p id="signupMessage" role="status" aria-live="polite"></p>
        </form>

        <script src="/js/signup.js" defer></script>
    </main>
    <script src="/js/nav-auth.js" defer></script>
</body>
</html>
